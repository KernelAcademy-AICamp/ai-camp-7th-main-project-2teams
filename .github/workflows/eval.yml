name: Eval

# 태깅 품질에 영향 주는 파일이 바뀐 PR에서만 실행되는 회귀 게이트 (실 OpenAI 호출, PR당 ~$0.1 · 약 12분).
# - required check 아님: paths 필터로 미실행돼도 머지 안 막힘 (ci.yml의 데드락 방지 주석 참조).
# - OPENAI_API_KEY 저장소 시크릿 필수. 미등록이면 평가를 skip하고 경고만 남긴다(아래 가드).
# - baseline은 run 간 분산(±0.013 관측) 아래로 잡혀 있어 오탐 없음 — front/lib/__tests__/tag-eval.test.ts 주석 참조.
# - search eval은 프로덕션 Supabase에 쓰기(throwaway user 생성)가 필요해 CI 제외 — 수동 실행 유지(docs/eval-set-plan.md).
on:
  pull_request:
    paths:
      - 'front/lib/ai.ts'
      - 'front/lib/tag-alias.ts'
      - 'front/lib/tag-eval.ts'
      - 'front/eval/tag-golden.json'
      - 'front/lib/__tests__/tag-eval.test.ts'

jobs:
  tag-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - working-directory: front
        run: npm ci
      - name: 태깅 골든셋 회귀 게이트 (rich + title-only, n=213×2)
        working-directory: front
        run: |
          # 시크릿 미등록 상태에서 그냥 돌리면 OpenAI 클라이언트 생성 단계에서 죽어
          # "회귀 감지"가 아닌 "크레덴셜 부재"로 항상 빨간불이 된다 → 경고 남기고 skip.
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning title=태깅 회귀 게이트 미실행::OPENAI_API_KEY 시크릿이 없어 골든셋 평가를 건너뜁니다. 게이트를 활성화하려면 저장소 시크릿에 OPENAI_API_KEY를 등록하세요."
            exit 0
          fi
          RUN_TAG_EVAL=1 npx vitest run lib/__tests__/tag-eval.test.ts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        timeout-minutes: 25
